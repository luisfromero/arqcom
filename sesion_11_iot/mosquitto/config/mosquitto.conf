# Minimal config for local classroom use
allow_anonymous true

listener 1883 0.0.0.0

# Optional WebSockets listener for tools like MQTT Explorer (WS)
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

