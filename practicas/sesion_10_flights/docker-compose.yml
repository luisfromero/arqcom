services:
  flights:
    build: .
    image: flight-tracker:latest
    container_name: flight-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"               # la app Android accede a http://<IP-del-PC>:8000
    volumes:
      - ./data:/data
    environment:
      # --- API ---
      API_KEY: "${API_KEY:-}"      # se lee de .env (no se sube a git); la app la envía en X-API-Key
      CACHE_TTL_SECONDS: "900"    # las búsquedas idénticas se sirven de caché 15 min
      ROOT_PATH: "/vuelos-api"     # detrás de https://casium.uma.es/vuelos-api -> "/vuelos-api"

      # --- Ofertas a capitales europeas (/api/deals) ---
      DEALS_ORIGIN: "AGP"         # origen por defecto (Málaga)
      DEALS_WORKERS: "3"          # consultas en paralelo a Google
      DEALS_MAX_QUERIES: "400"    # límite de consultas por escaneo
      DEALS_FETCH_MODE: "common"  # common = rápido; auto/local usaría Playwright (muy lento)

      # --- Precálculo de ofertas en SQLite (/api/deals/latest responde al instante) ---
      PRECOMPUTE_ENABLED: "true"
      PRECOMPUTE_TIMES: "06:00,18:00"   # escaneos diarios (hora local TZ)
      PRECOMPUTE_WEEKDAYS: "3,4,5"      # días de salida: 0=lun ... 6=dom (jue, vie, sáb)
      PRECOMPUTE_NIGHTS: "2-4"          # noches de estancia
      PRECOMPUTE_WEEKS: "8"             # horizonte de salidas
      PRECOMPUTE_START_DAYS: "2"        # primera salida: hoy + N días
      PRECOMPUTE_STALE_HOURS: "12"      # al arrancar, escanea si el último tiene más de N horas
      PRECOMPUTE_MAX_AGE_HOURS: "36"    # no se sirven precios más viejos
      PRECOMPUTE_DB: "/data/deals.db"

      # --- Alojamiento barato en Google Hotels (Playwright, /api/hotels) ---
      HOTELS_ENABLED: "true"            # tras cada precálculo, busca alojamiento para los vuelos baratos
      HOTELS_FLIGHT_MAX_PRICE: "100"    # solo combinaciones con vuelo <= este precio
      HOTELS_MAX_SEARCHES: "200"        # máximo de búsquedas por escaneo (~10 s cada una)
      HOTELS_STALE_HOURS: "20"          # no repite una búsqueda más reciente (≈ una vez al día)
      HOTELS_CONCURRENCY: "2"           # Chromium simultáneos (≈300 MB cada uno)
      HOTELS_MIN_RATING: "3.5"          # filtros por defecto: valoración y nº de reseñas mínimos
      HOTELS_MIN_REVIEWS: "20"

      # --- Ruta en seguimiento diario (vacía ORIGIN para usar solo /api/search) ---
      ORIGIN: "AGP"
      DESTINATION: "LHR"
      DEPARTURE_DATE: "2026-12-15"
      RETURN_DATE: ""             # vacío = solo ida; con fecha = ida y vuelta
      ADULTS: "1"
      SEAT_CLASS: "economy"       # economy | premium-economy | business | first
      MAX_STOPS: ""               # vacío = sin límite; 0 = directo
      CURRENCY: "EUR"

      # --- Alertas ---
      PRICE_THRESHOLD: "80"       # EUR; alerta si el mínimo es inferior
      WEBHOOK_URL: ""             # n8n / Discord / Telegram / cualquier endpoint JSON
      WEBHOOK_MODE: "alert"       # alert = solo bajo umbral | always = resumen diario siempre
      TELEGRAM_CHAT_ID: ""        # solo si WEBHOOK_URL es https://api.telegram.org/bot<TOKEN>/sendMessage

      # --- Ejecución ---
      FETCH_MODE: "auto"          # auto (common -> local) | common | local | fallback | force-fallback
      GOOGLE_SOCS: ""             # vacío = cookie de consentimiento por defecto
      RUN_MODE: "schedule"        # solo para "python flight_tracker.py": once = una consulta y salir
      SCHEDULE_TIME: "08:00"      # hora local (TZ) de la consulta diaria
      RUN_ON_START: "true"        # hacer una consulta nada más arrancar
      TOP_N: "5"                  # vuelos a mostrar en el log
      DATA_FILE: "/data/prices.csv"
      TZ: "Europe/Madrid"

  # Visor web de la base de datos de ofertas: http://localhost:8082
  # (solo lectura; tablas, filtros y consultas SQL desde el navegador)
  db-viewer:
    image: coleifer/sqlite-web:latest
    container_name: flight-db-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data:/data
    command: ["sqlite_web", "--host", "0.0.0.0", "--port", "8080", "--read-only", "/data/deals.db"]
    depends_on:
      - flights
